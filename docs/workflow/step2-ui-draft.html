<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>To-Do App — UI 초안 (STEP 2 산출물)</title>
    <style>
      /* 이 파일은 Figma 대신 쓰는 정적 UI 초안(와이어프레임)이다. 실제 구현은 React+Tailwind.
         색/간격은 구현 시 Tailwind 토큰으로 옮긴다. 여기선 레이아웃·상태 표현만 확인. */
      :root {
        --bg: #f5f6f8; --panel: #fff; --text: #1f2430; --muted: #6b7280;
        --border: #e5e7eb; --primary: #3b82f6; --primary-fg: #fff;
        --near: #f59e0b; --near-bg: #fff7ed; --overdue: #ef4444; --overdue-bg: #fef2f2;
        --done: #9ca3af; --pin-bg: #eff6ff;
      }
      [data-theme="dark"] {
        --bg: #0f1115; --panel: #181b22; --text: #e5e7eb; --muted: #9ca3af;
        --border: #2a2f3a; --primary: #3b82f6; --primary-fg: #fff;
        --near-bg: #3a2a10; --overdue-bg: #3a1414; --done: #6b7280; --pin-bg: #16233a;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text);
        font: 14px/1.5 -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; }
      .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 80px; }
      .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      h1 { font-size: 20px; margin: 0; }
      .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
      .mt { margin-top: 16px; }
      .muted { color: var(--muted); }
      input, select, button { font: inherit; color: inherit; }
      .input, select { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
        padding: 8px 10px; color: var(--text); }
      .btn { border: 1px solid var(--border); background: var(--panel); border-radius: 8px;
        padding: 8px 12px; cursor: pointer; }
      .btn.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
      .btn.danger { color: var(--overdue); border-color: var(--overdue); }
      .btn:disabled { opacity: .5; cursor: not-allowed; }
      .err { color: var(--overdue); font-size: 12px; margin-top: 4px; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .toolbar .grow { flex: 1; min-width: 160px; }
      .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
      .seg button { border: 0; background: var(--panel); padding: 7px 12px; cursor: pointer; }
      .seg button[aria-pressed="true"] { background: var(--primary); color: var(--primary-fg); }
      ul.list { list-style: none; margin: 12px 0 0; padding: 0; }
      li.item { display: grid; grid-template-columns: 24px 24px 1fr auto auto auto auto;
        align-items: center; gap: 10px; padding: 10px 8px; border-bottom: 1px solid var(--border); }
      li.item.pinned { background: var(--pin-bg); }
      .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .done .txt { color: var(--done); text-decoration: line-through; }
      .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
      .badge.near { color: var(--near); background: var(--near-bg); }
      .badge.overdue { color: var(--overdue); background: var(--overdue-bg); }
      .badge.normal { color: var(--muted); border: 1px solid var(--border); }
      .iconbtn { border: 0; background: transparent; cursor: pointer; font-size: 16px; line-height: 1; padding: 4px; }
      .iconbtn.on { color: var(--primary); }
      .pager { display: flex; gap: 6px; align-items: center; justify-content: center; margin-top: 16px; }
      .empty { text-align: center; padding: 40px 0; color: var(--muted); }
      .editor { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px;
        align-items: center; padding: 10px 8px; border-bottom: 1px solid var(--border); background: var(--pin-bg); }
      .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
        background: #111827; color: #fff; border-radius: 10px; padding: 12px 16px;
        display: flex; gap: 16px; align-items: center; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
      .toast button { background: transparent; border: 0; color: #93c5fd; cursor: pointer; font-weight: 600; }
      .statebar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
      .statebar button { font-size: 12px; }
      .note { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="row-between">
        <h1>📝 To-Do List</h1>
        <button class="btn" id="themeBtn" onclick="toggleTheme()">🌙 다크</button>
      </div>
      <p class="note">Figma 대체 UI 초안 — 아래 버튼으로 상태별 화면을 전환해 확인하세요.</p>
      <div class="statebar">
        <button class="btn" onclick="setState('normal')">목록</button>
        <button class="btn" onclick="setState('editing')">행 편집</button>
        <button class="btn" onclick="setState('empty')">빈 목록</button>
        <button class="btn" onclick="setState('noresult')">검색 0건</button>
        <button class="btn" onclick="setState('loading')">로딩</button>
        <button class="btn" onclick="setState('error')">에러</button>
        <button class="btn" onclick="toggleToast()">Undo 토스트</button>
      </div>

      <!-- 추가 폼 -->
      <div class="panel">
        <div class="toolbar">
          <input class="input grow" placeholder="할 일을 입력하세요" value="" />
          <input class="input" type="date" />
          <button class="btn primary">추가</button>
        </div>
        <div class="err">할 일을 입력하세요 / 과거 날짜는 선택할 수 없습니다 (검증 예시)</div>
      </div>

      <!-- 툴바 -->
      <div class="panel mt">
        <div class="toolbar">
          <input class="input grow" placeholder="🔍 검색 (브라우저 재오픈 시 유지)" value="" />
          <div class="seg" role="group" aria-label="상태 필터">
            <button aria-pressed="true">전체</button>
            <button aria-pressed="false">진행중</button>
            <button aria-pressed="false">완료</button>
          </div>
          <label class="muted">표시
            <select><option>5</option><option selected>10</option><option>20</option></select>
          </label>
        </div>
        <div class="toolbar mt">
          <label><input type="checkbox" /> 전체선택</label>
          <span class="muted" id="selcount">2개 선택됨</span>
          <button class="btn danger">선택 삭제</button>
        </div>
      </div>

      <!-- 목록 영역 (상태별 전환) -->
      <div class="panel mt" id="listPanel">
        <ul class="list" id="list">
          <!-- 고정 + 완료 + 마감임박/지남 예시 -->
          <li class="item pinned">
            <input type="checkbox" />
            <input type="checkbox" checked title="완료" />
            <span class="txt">📌 보고서 제출 (고정)</span>
            <span class="badge overdue">2일 지남</span>
            <button class="iconbtn on" title="고정 해제">📌</button>
            <button class="iconbtn" title="편집">✏️</button>
            <button class="iconbtn" title="삭제">🗑️</button>
          </li>
          <li class="item">
            <input type="checkbox" checked />
            <input type="checkbox" title="완료" />
            <span class="txt">우유 사기</span>
            <span class="badge near">D-1</span>
            <button class="iconbtn" title="고정">📌</button>
            <button class="iconbtn" title="편집">✏️</button>
            <button class="iconbtn" title="삭제">🗑️</button>
          </li>
          <li class="item done">
            <input type="checkbox" />
            <input type="checkbox" checked title="완료" />
            <span class="txt">운동하기 (완료)</span>
            <span class="badge normal">D-10</span>
            <button class="iconbtn" title="고정">📌</button>
            <button class="iconbtn" title="편집">✏️</button>
            <button class="iconbtn" title="삭제">🗑️</button>
          </li>
        </ul>

        <!-- 인라인 편집 모드 (editing 상태에서 노출) -->
        <div class="editor" id="editor" style="display:none">
          <input class="input" value="운동하기" />
          <input class="input" type="date" />
          <button class="btn primary">저장</button>
          <button class="btn">취소</button>
        </div>

        <!-- 빈/결과없음/로딩/에러 (상태별) -->
        <div class="empty" id="emptyEmpty" style="display:none">🗒️ 할 일이 없습니다. 위에서 추가해보세요.</div>
        <div class="empty" id="emptyNoresult" style="display:none">🔍 검색 결과가 없습니다.</div>
        <div class="empty" id="emptyLoading" style="display:none">⏳ 불러오는 중…</div>
        <div class="empty" id="emptyError" style="display:none; color: var(--overdue)">⚠️ 목록을 불러오지 못했습니다. 다시 시도해주세요.</div>

        <div class="pager" id="pager">
          <button class="btn">‹ 이전</button>
          <span class="muted">1 / 3</span>
          <button class="btn">다음 ›</button>
        </div>
      </div>
    </div>

    <!-- Undo 토스트 -->
    <div class="toast" id="toast" style="display:none">
      <span>2개 항목을 삭제했습니다.</span>
      <button onclick="toggleToast()">실행취소</button>
    </div>

    <script>
      function toggleTheme() {
        const el = document.documentElement;
        const dark = el.getAttribute("data-theme") === "dark";
        el.setAttribute("data-theme", dark ? "light" : "dark");
        document.getElementById("themeBtn").textContent = dark ? "🌙 다크" : "☀️ 라이트";
      }
      function toggleToast() {
        const t = document.getElementById("toast");
        t.style.display = t.style.display === "none" ? "flex" : "none";
      }
      function setState(s) {
        const show = (id, on) => (document.getElementById(id).style.display = on ? "" : "none");
        const blocks = { list: false, editor: false, emptyEmpty: false, emptyNoresult: false,
          emptyLoading: false, emptyError: false, pager: false };
        if (s === "normal") { blocks.list = true; blocks.pager = true; }
        if (s === "editing") { blocks.list = true; blocks.editor = true; blocks.pager = true; }
        if (s === "empty") blocks.emptyEmpty = true;
        if (s === "noresult") blocks.emptyNoresult = true;
        if (s === "loading") blocks.emptyLoading = true;
        if (s === "error") blocks.emptyError = true;
        document.getElementById("list").style.display = blocks.list ? "" : "none";
        document.getElementById("editor").style.display = blocks.editor ? "" : "none";
        show("emptyEmpty", blocks.emptyEmpty); show("emptyNoresult", blocks.emptyNoresult);
        show("emptyLoading", blocks.emptyLoading); show("emptyError", blocks.emptyError);
        show("pager", blocks.pager);
      }
      setState("normal");
    </script>
  </body>
</html>
